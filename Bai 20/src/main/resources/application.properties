spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# max so luong cac pool ma service có
spring.datasource.hikari.maximum-pool-size=30 
# th?i gian connection timeout khi s? d?ng
spring.datasource.hikari.connection-timeout=30000
# thoi gian ton tai trong tr?ng thái idle ch? vi?c t? các thread khác
spring.datasource.hikari.idle-timeout=600000
# th?i gian t?i data connection có th? s?ng
spring.datasource.hikari.max-lifetime=1800000

# config JPA
# config ch? ??nh t?o update/t?o m?i table trong db d?a vào entity, l?u ý ch? b?t update, create trong quá trình tìm hi?m ho?c demo, trong th?c t? config này s? none ?? không thay ??i c?u trúc db t? service
spring.jpa.hibernate.ddl-auto=update
# show ra sql trong orm khi thuc hi?n, có th? ?? ?? ?? debug ?? bi?t th?c t? query ???c to ra
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
