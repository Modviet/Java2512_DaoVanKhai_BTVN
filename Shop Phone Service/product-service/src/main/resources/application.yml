spring:
  application:
    name: product-service

  datasource:
    url: jdbc:postgresql://localhost:5432/shop_Phone
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  config:
    import: optional:configserver:http://localhost:8888

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true